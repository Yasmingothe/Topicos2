# conexao com o banco (o container armas-postgres)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=topicos2
quarkus.datasource.password=123456
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/topicos2db

# recria as tabelas toda vez que o projeto sobe
quarkus.hibernate-orm.database.generation=drop-and-create

# nao deixar o Quarkus criar outro banco sozinho no Docker
quarkus.devservices.enabled=false

# mostra no terminal o SQL que o Hibernate executa
quarkus.hibernate-orm.log.sql=true

# libera o Angular (porta 4200) para chamar a API
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,PUT,POST,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
# ===== login com JWT =====
# a chave PÚBLICA confere o token; a PRIVADA assina (fica só no back, nunca no front)
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=armas-jwt
smallrye.jwt.sign.key.location=privateKey.pem

# ===== fotos dos produtos =====
# pasta no computador onde as fotos ficam salvas (fora do projeto, para não sumir no drop-and-create)
armas.imagens.pasta=${user.home}/armas-imagens
quarkus.http.limits.max-body-size=10M
