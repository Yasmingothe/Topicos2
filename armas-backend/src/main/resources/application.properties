# conexao com o banco (o container armas-postgres)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=topicos2
quarkus.datasource.password=123456
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/topicos2db

# recria as tabelas toda vez que o projeto sobe
quarkus.hibernate-orm.database.generation=drop-and-create

# nao deixar o Quarkus criar outro banco sozinho no Docker
quarkus.devservices.enabled=false

# mostra no terminal o SQL que o Hibernate executa
quarkus.hibernate-orm.log.sql=true

# libera o Angular (porta 4200) para chamar a API
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,PUT,POST,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
# ===== Keycloak (login e permissões) =====
# o Keycloak roda no Docker na porta 8180 (ver docker-compose.yml na raiz do projeto)
armas.keycloak.url=http://localhost:8180
armas.keycloak.realm=armas

# quarkus-oidc: confere o token que o Angular manda no cabeçalho Authorization
# (service = só confere token; quem faz o login é o nosso AuthResource)
quarkus.oidc.auth-server-url=${armas.keycloak.url}/realms/${armas.keycloak.realm}
quarkus.oidc.client-id=armas-backend
quarkus.oidc.credentials.secret=${armas.keycloak.login.secret}
quarkus.oidc.application-type=service
# os papéis ADMIN e CLIENTE vêm dentro do token em realm_access.roles (usados no @RolesAllowed)
quarkus.oidc.roles.role-claim-path=realm_access/roles
# espera o Keycloak subir (até 30s) antes de desistir
quarkus.oidc.connection-delay=30S
# não deixar o Quarkus tentar subir outro Keycloak sozinho
quarkus.keycloak.devservices.enabled=false

# só confere o token quando a rota pede login (as rotas @PermitAll funcionam mesmo com token vencido)
quarkus.http.auth.proactive=false

# client que faz o login dos usuários (troca e-mail + senha por token)
armas.keycloak.login.client-id=armas-backend
armas.keycloak.login.secret=${KEYCLOAK_LOGIN_SECRET:0BYTZg9JilJV811Gq2ItOsAOzWSgT18y}

# client "robô" que cria usuários, dá papéis e desativa contas (API de administração do Keycloak)
# as credenciais ficam SÓ aqui no back; o Angular nunca vê
armas.keycloak.admin.client-id=armas-admin
armas.keycloak.admin.secret=${KEYCLOAK_ADMIN_SECRET:DbaAPv_U-sqTZb0KG1m7iUY7XQlOvxOV}

# ===== e-mail ("Esqueci minha senha") =====
# PADRÃO: Mailpit (caixa de teste do docker-compose, e-mails em http://localhost:8025)
# E-MAIL DE VERDADE (Gmail): crie o arquivo armas-backend/.env (veja o .env.exemplo).
# O .env NÃO vai para o GitHub (está no .gitignore), então a senha do e-mail fica só no seu computador.
quarkus.mailer.from=${MAIL_FROM:ZERO1 <nao-responda@zero1.com>}
quarkus.mailer.host=${MAIL_HOST:localhost}
quarkus.mailer.port=${MAIL_PORT:1025}
quarkus.mailer.username=${MAIL_USUARIO:}
quarkus.mailer.password=${MAIL_SENHA:}
quarkus.mailer.start-tls=${MAIL_START_TLS:DISABLED}
quarkus.mailer.login=${MAIL_LOGIN:DISABLED}
# no modo dev o Quarkus só "finge" que manda; aqui queremos mandar de verdade
quarkus.mailer.mock=false
# endereço do Angular (o link do e-mail abre a tela de nova senha nele)
armas.site.url=http://localhost:4200
# quanto tempo o link de recuperação vale
armas.recuperacao.validade-minutos=30

# ===== fotos dos produtos =====
# pasta no computador onde as fotos ficam salvas (fora do projeto, para não sumir no drop-and-create)
armas.imagens.pasta=${user.home}/armas-imagens
quarkus.http.limits.max-body-size=10M
