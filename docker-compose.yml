services:
  # Banco de dados da aplicação (PostgreSQL)
  armas-postgres:
    image: postgres:16-alpine
    container_name: armas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-topicos2db}
      POSTGRES_USER: ${DB_USER:-topicos2}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - armas_pgdata:/var/lib/postgresql/data
    networks:
      - zero1-network

  # Banco de dados exclusivo para o Keycloak
  keycloak-postgres:
    image: postgres:16-alpine
    container_name: keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_secret
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    networks:
      - zero1-network

  # Servidor de Autenticação Keycloak (OpenID Connect / OAuth2)
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: keycloak-zero1
    restart: unless-stopped
    command:
      - "start-dev"
      - "--import-realm"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_secret
      KC_HTTP_PORT: 8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-zero1.json:/opt/keycloak/data/import/realm-zero1.json:ro
    depends_on:
      - keycloak-postgres
    networks:
      - zero1-network

volumes:
  armas_pgdata:
  keycloak_pgdata:

networks:
  zero1-network:
    driver: bridge
