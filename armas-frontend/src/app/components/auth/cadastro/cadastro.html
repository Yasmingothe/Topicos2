<div class="tela">

  <header class="topo">
    <a routerLink="/" class="voltar-loja"><mat-icon>arrow_back</mat-icon> Voltar para a loja</a>
    <a routerLink="/" class="logo" aria-label="ZERO1, voltar para a loja">
      <span class="logo-icone"><mat-icon>gps_fixed</mat-icon></span>
      ZERO1
    </a>
  </header>

  <section class="formulario">
    <div class="cartao" style="text-align: center; padding: 2rem;">
      <h1>Criar conta no ZERO1</h1>
      <p class="apoio">Você está sendo redirecionado para a página de cadastro seguro do Keycloak.</p>

      <div style="margin: 2rem 0;">
        <button mat-flat-button type="button" class="botao" (click)="criar()">
          <mat-icon>person_add</mat-icon>
          Ir para o Cadastro no Keycloak
        </button>
      </div>

      <p class="troca">Já tem conta? <a routerLink="/login">Entrar</a></p>
      <div class="separador"><span>ou</span></div>
      <a mat-stroked-button routerLink="/" class="botao-visitante">Continuar sem entrar</a>
      <p class="dica-visitante">Você pode ver os produtos e montar o carrinho. A conta só é pedida para finalizar a compra.</p>
    </div>
  </section>

</div>
